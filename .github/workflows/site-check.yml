name: Проверка сайта и формы

# Каждые 3 часа + вручную (вкладка Actions → Run workflow).
# Публичный репозиторий: минуты GitHub Actions бесплатны.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/**"

permissions:
  contents: read
  issues: write

concurrency:
  group: site-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить findorfree.com
        id: run
        continue-on-error: true
        run: python3 .github/scripts/site_check.py

      # При сбое открываем задачу (issue) «Сбой сайта» — GitHub присылает письмо владельцу.
      # Пока сбой не ушёл, новые задачи не плодим, а дописываем комментарий.
      - name: Итог на PR (тестовый запуск)
        if: github.event_name == 'pull_request'
        run: |
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.run.outcome }}" = success ]

      - name: Сообщить о сбое
        if: steps.run.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create site-down --color d73a4a --description "Сбой findorfree.com" 2>/dev/null || true
          num=$(gh issue list --label site-down --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file report.md
          else
            gh issue create --title "🔴 Сбой сайта findorfree.com" --label site-down --assignee "${{ github.repository_owner }}" --body-file report.md \
              || gh issue create --title "🔴 Сбой сайта findorfree.com" --label site-down --body-file report.md
          fi
          exit 1   # красный значок в Actions + письмо GitHub о неудачном запуске

      - name: Закрыть задачу, если всё снова работает
        if: steps.run.outcome == 'success' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for num in $(gh issue list --label site-down --state open --json number --jq '.[].number'); do
            gh issue close "$num" --comment "✅ Сайт и форма снова работают. $(head -1 report.md)"
          done
