<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FindOrFree — No find, no pay. We find anything, in any language</title>
<meta name="description" content="FindOrFree: a paid human-verified search service. No find, no pay. Tell us what to find — a product, a supplier, a contact, a fact — in any language. Answer within hours. Money back if we fail.">

<style>
:root{
  --bg:#0b1020;--bg2:#121a33;--card:#161f3d;--line:#263057;
  --ink:#f3f5ff;--muted:#a9b2d6;--accent:#ffb347;--accent2:#ff7a59;--ok:#4ad295;
  --radius:18px;--font:'Inter',system-ui,sans-serif;--display:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#243266 0%,transparent 60%),var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased}
html[dir=rtl] body{font-family:'Heebo',var(--font)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:12px;padding-top:6px;padding-bottom:6px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo svg{width:30px;height:30px}
.logo .tag-line{font-family:var(--font);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-inline-start:6px;padding-inline-start:10px;border-inline-start:1px solid var(--line)}
@media(max-width:600px){.logo .tag-line{display:none}}
.lang{display:flex;gap:4px;flex-wrap:wrap}
.lang button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer}
.lang select{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 8px;font-size:13px;cursor:pointer;width:58px}
.lang select option{background:#0b1020;color:#e8ecf7}
.lang select.on{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600;width:auto;max-width:120px}
.swbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px);background:#141b33;border:1px solid var(--accent);border-radius:16px;padding:12px 14px;box-shadow:0 10px 40px rgba(0,0,0,.5);color:#e8ecf7;font-size:14px}
.swbar.show{display:flex}
.swbar small{color:var(--muted);display:block;font-size:12px}
.swbar button{border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;border:1px solid var(--line);background:transparent;color:#e8ecf7}
.swbar button.yes{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
.lang button.on{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
.hero{padding:72px 0 40px;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;background:rgba(74,210,149,.12);border:1px solid rgba(74,210,149,.45);color:#9ff0c9;border-radius:999px;padding:9px 16px;font-size:15px;font-weight:600;margin-bottom:20px}
.eyebrow b{color:var(--ok)}
.stars{display:flex;gap:6px;justify-content:center;margin:12px 0 6px}
.stars button{background:transparent;border:0;font-size:38px;cursor:pointer;color:#3a4670;transition:.15s;line-height:1}
.stars button.on{color:var(--accent);transform:scale(1.1)}
.rv-empty{border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);font-size:15px;margin-bottom:24px}
.hero h1{font-family:var(--display);font-size:clamp(38px,6vw,68px);line-height:1.02;margin:0 0 18px;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:19px;color:var(--muted);margin:0 0 28px;max-width:560px}
.cta{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1200;text-decoration:none;font-weight:600;padding:16px 26px;border-radius:999px;font-size:17px;box-shadow:0 10px 30px rgba(255,150,80,.3)}
.cta:hover{transform:translateY(-1px)}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.badge{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.02)}
.glass{position:relative;border-radius:26px;padding:26px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.glass .q{font-size:14px;color:var(--muted);margin-bottom:8px}
.glass .msg{background:rgba(0,0,0,.25);border-radius:14px;padding:14px 16px;font-size:15px;margin-bottom:12px;border:1px solid rgba(255,255,255,.08)}
.glass .msg.a{border-color:rgba(74,210,149,.35)}
.glass .tag{display:inline-block;font-size:12px;color:var(--ok);margin-bottom:6px;font-weight:600}
.typing{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
section{padding:56px 0}
h2{font-family:var(--display);font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 30px;font-size:17px;max-width:620px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
#pricing .grid3{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){#pricing .grid3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){#pricing .grid3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.card .n{width:38px;height:38px;border-radius:12px;background:rgba(255,179,71,.15);color:var(--accent);display:grid;place-items:center;font-weight:700;margin-bottom:14px;font-family:var(--display);font-size:18px}
.card h3{margin:0 0 8px;font-size:19px}
.card p{margin:0;color:var(--muted);font-size:15px}
.price{position:relative;cursor:pointer;transition:.2s;border-width:2px}
.price:hover,.price.sel{border-color:var(--accent);transform:translateY(-3px)}
.price .amt{font-family:var(--display);font-size:44px;font-weight:800;letter-spacing:-.03em;margin:6px 0}
.price .amt small{font-size:16px;color:var(--muted);font-weight:500;font-family:var(--font)}
.price ul{margin:14px 0 0;padding:0;list-style:none}
.price li{color:var(--muted);font-size:14px;padding:5px 0;padding-inline-start:22px;position:relative}
.price li:before{content:"✓";position:absolute;inset-inline-start:0;color:var(--ok);font-weight:700}
.price .pop{position:absolute;top:-12px;inset-inline-end:16px;background:var(--accent);color:#1a1200;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.ex{display:flex;flex-wrap:wrap;gap:10px}
.ex span{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted)}
form{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px;max-width:720px;margin:0 auto}
label{display:block;font-size:14px;color:var(--muted);margin:16px 0 6px;font-weight:500}
input,textarea,select{width:100%;background:#0e1530;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tier{border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:center;background:#0e1530}
.tier.sel{border-color:var(--accent);background:rgba(255,179,71,.08)}
.tier b{display:block;font-size:20px;font-family:var(--display)}
.tier span{font-size:12px;color:var(--muted)}
.btn{width:100%;margin-top:22px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1200;font-weight:700;font-size:17px;padding:16px;border-radius:999px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.note{font-size:13px;color:var(--muted);margin-top:12px;text-align:center}
.done{display:none;text-align:center;padding:10px 0}
.done h3{font-family:var(--display);font-size:28px;margin:10px 0}
.done .alt{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.done .alt a,.done .alt button{text-decoration:none;border:1px solid var(--line);background:#0e1530;color:var(--ink);border-radius:999px;padding:12px 18px;font-size:15px;cursor:pointer;font-family:inherit}
.done pre{text-align:start;white-space:pre-wrap;background:#0e1530;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;color:var(--muted);max-height:220px;overflow:auto}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between}
.faq summary:after{content:"+";color:var(--accent);font-size:22px;line-height:1}
.faq details[open] summary:after{content:"–"}
.faq p{color:var(--muted);margin:10px 0 0}
footer .legal a{color:var(--muted)}
footer{border-top:1px solid var(--line);padding:30px 0 50px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:10px}
.trust div{text-align:center;padding:18px 10px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,255,255,.02)}
.trust b{display:block;font-family:var(--display);font-size:30px;color:var(--accent)}
.trust span{font-size:13px;color:var(--muted)}
@media(max-width:820px){
  .hero{grid-template-columns:1fr;padding-top:40px}
  .grid3,.trust{grid-template-columns:1fr}
  .tiers{grid-template-columns:1fr 1fr}
  form{padding:22px}
  .lang button{padding:4px 8px;font-size:12px}
  .lang select{padding:4px 4px;font-size:12px;width:46px}
  .lang{justify-content:flex-end}
  .swbar{width:calc(100% - 32px)}
}
</style>
</head>
<body>
<header><div class="wrap nav">
  <div class="logo"><svg viewBox="0 0 32 32" fill="none"><circle cx="14" cy="14" r="9" stroke="#ffb347" stroke-width="3.2"/><path d="M21 21l7 7" stroke="#ff7a59" stroke-width="3.6" stroke-linecap="round"/><circle cx="14" cy="14" r="3" fill="#ffb347"/></svg><span>Find<span style="color:var(--accent)">Or</span>Free</span><small class="tag-line">no find · no pay</small></div>
  <div class="lang" id="lang"></div>
</div></header>

<main class="wrap">
<section class="hero">
  <div>
    <div class="eyebrow">💸 <span data-i18n="eyebrow"></span></div>

    <p class="lead" data-i18n="lead"></p>
    <a class="cta" href="#request" data-i18n="cta"></a>
    <div class="badges"><span class="badge" data-i18n="b1"></span><span class="badge" data-i18n="b2"></span><span class="badge" data-i18n="b3"></span></div>
  </div>
  <div class="glass">
    <div class="q" data-i18n="demo_q"></div>

  </div>
</section>

<section id="how">

    <div class="card"><div class="n">1</div><h3 data-i18n="s1h"></h3><p data-i18n="s1p"></p></div>
    <div class="card"><div class="n">2</div><h3 data-i18n="s2h"></h3><p data-i18n="s2p"></p></div>

    <div class="card price" data-tier="deep"><h3 data-i18n="t3h"></h3><div class="amt">$30</div><p data-i18n="t3p"></p><ul><li data-i18n="t3a"></li><li data-i18n="t3b"></li><li data-i18n="t3c"></li></ul></div>
    <div class="card price" data-tier="project"><h3 data-i18n="t4h"></h3><div class="amt" style="font-size:30px;padding:8px 0" data-i18n="t4amt"></div><p data-i18n="t4p"></p><ul><li data-i18n="t4a"></li><li data-i18n="t4b"></li><li data-i18n="t4c"></li></ul></div>

  <div class="trust">

  </div>
</section>

<section id="examples">

</section>

<section id="request">
  <h2 data-i18n="f_h"></h2><p class="sub" data-i18n="f_sub"></p>

        <div class="tier" data-tier="deep"><b>$30</b><span data-i18n="t3h"></span></div>

      </div>

      <pre id="summary"></pre>
    </div>
  </form>
</section>

<section id="reviews">
  <h2 data-i18n="rv_h"></h2><p class="sub" data-i18n="rv_sub"></p>
  <div class="rv-empty" data-i18n="rv_empty"></div>

    <div id="rvbody">
      <label style="text-align:center" data-i18n="rv_rate"></label>
      <div class="stars" id="stars"><button type="button" data-s="1">★</button><button type="button" data-s="2">★</button><button type="button" data-s="3">★</button><button type="button" data-s="4">★</button><button type="button" data-s="5">★</button></div>

      <label for="rvname" data-i18n="rv_name"></label>
      <input id="rvname" type="text">
      <button class="btn" type="submit" data-i18n="rv_btn"></button>
    </div>
    <div class="done" id="rvdone">
      <div style="font-size:48px">⭐</div>
      <h3 data-i18n="rv_thanks"></h3>
      <p class="sub" style="margin:0 auto 10px" id="rv_dtext"></p>
      <div class="alt" id="rvalt"></div>
    </div>
  </form>
</section>

<section class="faq" id="faq">
  <h2 data-i18n="faq_h"></h2>
  <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
  <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
  <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
  <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
</section>
</main>

<footer class="wrap">

  <div class="legal"><a href="legal.html#terms" data-i18n="lg_terms"></a> · <a href="legal.html#refund" data-i18n="lg_refund"></a> · <a href="legal.html#privacy" data-i18n="lg_privacy"></a></div>
</footer>

/* Основные языки — кнопками наверху; остальные (файл i18n-extra.js) — в меню 🌐.
   Язык выбирается автоматически по языку браузера посетителя; если такого нет — английский. */
const MAIN_LANGS=["en","ru","he","es","de"];
Object.assign(I18N, window.I18N_EXTRA||{});
let lang="en", tier="standard";
/* Сайт у всех открывается на английском. Если язык браузера другой и он у нас есть —
   внизу плашка на языке посетителя: через 10 секунд переключаем сам, можно отказаться. Выбор запоминается. */
function savedLang(){try{const s=localStorage.getItem("fof_lang"); if(s&&I18N[s]) return s;}catch(e){} return null;}
function browserLang(){
  const list=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"]);
  for(const x of list){
    let l=String(x).slice(0,2).toLowerCase(); if(l==="iw") l="he";
    if(I18N[l]) return l;
  }
  return "en";
}
function detect(){ return savedLang()||"en"; }
let swTimer=null;
function hideSwitch(){ clearInterval(swTimer); swTimer=null; document.getElementById("swbar").classList.remove("show"); }
function offerSwitch(){
  if(savedLang()) return;
  const c=browserLang(); if(c==="en") return;
  const L=I18N[c], tx=k=>L[k]??I18N.en[k];
  const bar=document.getElementById("swbar"); bar.dir=L.dir; bar.lang=c;
  document.getElementById("sw_q").textContent=tx("sw_q");
  document.getElementById("sw_yes").textContent=L.name;
  document.getElementById("sw_no").textContent=tx("sw_no");
  let left=10; const tEl=document.getElementById("sw_t");
  const tick=()=>{tEl.textContent=tx("sw_auto").replace("{s}",left);};
  tick(); bar.classList.add("show");
  swTimer=setInterval(()=>{left--; if(left<=0){hideSwitch(); setLang(c);} else tick();},1000);
  document.getElementById("sw_yes").onclick=()=>{hideSwitch(); setLang(c);};
  document.getElementById("sw_no").onclick=()=>{hideSwitch(); setLang("en");};
}
function t(k){return I18N[lang][k]??I18N.en[k]??"";}
function render(){
  const d=I18N[lang];
  document.documentElement.lang=lang; document.documentElement.dir=d.dir;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.innerHTML=t(el.dataset.i18n);});
  document.getElementById("exlist").innerHTML=(d.ex||I18N.en.ex).map(x=>`<span>${x}</span>`).join("");
  const extra=Object.keys(I18N).filter(k=>!MAIN_LANGS.includes(k));
  document.getElementById("lang").innerHTML=MAIN_LANGS.map(k=>`<button class="${k===lang?'on':''}" data-l="${k}">${I18N[k].name}</button>`).join("")
    +(extra.length?`<select class="${extra.includes(lang)?'on':''}" aria-label="Language"><option value="">🌐${extra.includes(lang)?' '+I18N[lang].name:''}</option>${extra.map(k=>`<option value="${k}"${k===lang?' selected':''}>${I18N[k].name}</option>`).join("")}</select>`:"");
  document.getElementById("contact").textContent=t("contact")+" "+CONFIG.email;
  document.getElementById("year").textContent=new Date().getFullYear();
}
function setLang(l){ if(!I18N[l]) return; hideSwitch(); lang=l; try{localStorage.setItem("fof_lang",lang);}catch(e){} render(); }
document.getElementById("lang").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; setLang(b.dataset.l);
});
document.getElementById("lang").addEventListener("change",e=>{
  if(e.target.tagName==="SELECT"&&e.target.value) setLang(e.target.value);
});
function selTier(x){
  tier=x;
  document.querySelectorAll(".tier,.price").forEach(el=>el.classList.toggle("sel",el.dataset.tier===x));
}
document.addEventListener("click",e=>{
  const el=e.target.closest(".tier,.price"); if(!el) return; selTier(el.dataset.tier);
  if(el.classList.contains("price")) document.getElementById("request").scrollIntoView({behavior:"smooth"});
});

/* ===== Отправка заявок через Web3Forms (api.web3forms.com) =====
   FormData без JSON — браузер не делает предварительный запрос OPTIONS. Не вышло за 15 с — показываем запасной вариант (письмо/копирование). */
async function sendForm(payload){
  if(!CONFIG.web3formsKey) return false;
  try{
    const fd=new FormData();
    fd.append("access_key",CONFIG.web3formsKey);
    fd.append("subject",payload._subject||"[FindOrFree] new message");
    fd.append("from_name","FindOrFree website");
    Object.entries(payload).forEach(([k,v])=>{if(k!=="_subject") fd.append(k,v==null?"":String(v));});
    const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),15000);
    const r=await fetch(CONFIG.formEndpoint,{method:"POST",headers:{"Accept":"application/json"},body:fd,signal:ctrl.signal});
    clearTimeout(tm);
    let j={}; try{j=await r.json();}catch(_){}
    return r.ok && j.success!==false;
  }catch(err){return false;}
}

document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const req=document.getElementById("req"), email=document.getElementById("email");
  if(!req.value.trim()){req.focus();req.style.outline="2px solid #ff7a59";return;}
  if(!email.value.trim()||!/\S+@\S+\.\S+/.test(email.value)){email.focus();email.style.outline="2px solid #ff7a59";return;}
  const btn=document.querySelector(".btn"); btn.disabled=true;
  const price=tier==="project"?t("t4amt"):"$"+CONFIG.prices[tier];
  const payload={
    _subject:`[FindOrFree] ${tier.toUpperCase()} ${price} — new request`,
    tier, price, request:req.value.trim(), email:email.value.trim(),
    name:document.getElementById("name").value.trim(),
    deadline:document.getElementById("deadline").value, language:lang, page:location.href
  };
  const text=`FINDORFREE REQUEST\nLevel: ${tier} (${price})\nDeadline: ${payload.deadline}\nLanguage: ${lang}\nName: ${payload.name||"-"}\nEmail: ${payload.email}\n\n${payload.request}`;
  const sent=await sendForm(payload);
  document.getElementById("formbody").style.display="none";
  const done=document.getElementById("done"); done.style.display="block";
  const alt=document.getElementById("alt"); alt.innerHTML="";
  if(sent){
    document.getElementById("d_text").textContent=(tier==="project"?t("d_text_project"):t("d_text")).replace("{email}",payload.email).replace("{price}",price);
    document.getElementById("summary").style.display="none";
  }else{
    document.getElementById("d_text").textContent=t("d_fallback");
    if(CONFIG.whatsapp){const a=document.createElement("a");a.href="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(text);a.target="_blank";a.rel="noopener";a.textContent=t("d_wa");alt.appendChild(a);}
    const m=document.createElement("a");m.href="mailto:"+CONFIG.email+"?subject="+encodeURIComponent(payload._subject)+"&body="+encodeURIComponent(text);m.textContent=t("d_mail")+" · "+CONFIG.email;alt.appendChild(m);
    const c=document.createElement("button");c.type="button";c.textContent=t("d_copy");
    c.onclick=async()=>{try{await navigator.clipboard.writeText(text);c.textContent=t("d_copied");}catch(e){}};alt.appendChild(c);
    document.getElementById("summary").textContent=text;
  }
  done.scrollIntoView({behavior:"smooth",block:"center"});
});


/* ===== Рейтинг ===== */
let stars=0;
document.getElementById("stars").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;stars=+b.dataset.s;
  document.querySelectorAll("#stars button").forEach(x=>x.classList.toggle("on",+x.dataset.s<=stars));});
document.getElementById("rvform").addEventListener("submit",async e=>{
  e.preventDefault(); if(!stars){document.getElementById("stars").style.outline="2px solid #ff7a59";return;}
  const txt=document.getElementById("rvtext").value.trim(), nm=document.getElementById("rvname").value.trim();
  const payload={_subject:`[FindOrFree] Review ${stars}/5`,stars,review:txt,name:nm,language:lang,page:location.href};
  const text=`FINDORFREE REVIEW\nRating: ${stars}/5\nName: ${nm||"-"}\n\n${txt}`;
  const sent=await sendForm(payload);
  document.getElementById("rvbody").style.display="none";const d=document.getElementById("rvdone");d.style.display="block";
  const alt=document.getElementById("rvalt");alt.innerHTML="";
  if(sent){document.getElementById("rv_dtext").textContent=t("rv_sent");}
  else{document.getElementById("rv_dtext").textContent=t("rv_fallback");
    if(CONFIG.whatsapp){const a=document.createElement("a");a.href="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(text);a.target="_blank";a.rel="noopener";a.textContent=t("d_wa");alt.appendChild(a);}
    const m=document.createElement("a");m.href="mailto:"+CONFIG.email+"?subject="+encodeURIComponent(payload._subject)+"&body="+encodeURIComponent(text);m.textContent=t("d_mail")+" · "+CONFIG.email;alt.appendChild(m);
    const c=document.createElement("button");c.type="button";c.textContent=t("d_copy");c.onclick=async()=>{try{await navigator.clipboard.writeText(text);c.textContent=t("d_copied");}catch(e){}};alt.appendChild(c);}
  d.scrollIntoView({behavior:"smooth",block:"center"});
});

lang=detect(); render(); selTier("standard"); offerSwitch();
</script>
